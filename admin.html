  <input id="newName" placeholder="Customer Name">

<canvas id="tree" width="1200" height="700"></canvas>

<script>

const canvas=document.getElementById("tree");
const ctx=canvas.getContext("2d");

function node(x,y,text){
 ctx.beginPath();
 ctx.arc(x,y,25,0,Math.PI*2);
 ctx.fillStyle="#2563eb";
 ctx.fill();
 ctx.strokeStyle="#94a3b8";
 ctx.stroke();

 ctx.fillStyle="white";
 ctx.textAlign="center";
 ctx.textBaseline="middle";
 ctx.fillText(text,x,y);
}

function line(x1,y1,x2,y2){
 ctx.beginPath();
 ctx.moveTo(x1,y1);
 ctx.lineTo(x2,y2);
 ctx.strokeStyle="#94a3b8";
 ctx.stroke();
}

function drawTree(){

 ctx.clearRect(0,0,canvas.width,canvas.height);

 // ROOT
 node(600,80,"ROOT");

 // LINES
 line(600,100,350,230);
 line(600,100,850,230);

 // LEFT RIGHT
 node(350,250,"LEFT");
 node(850,250,"RIGHT");

 // LEVEL 2
 line(350,270,250,380);
 line(350,270,450,380);

 line(850,270,750,380);
 line(850,270,950,380);

 node(250,400,"L-L");
 node(450,400,"L-R");
 node(750,400,"R-L");
 node(950,400,"R-R");
}

drawTree();

function logout(){
 location="index.html";
}

</script>
