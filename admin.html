<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>RJVC Admin Tree</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
body{
  background:#020617;
  margin:0;
  color:white;
  font-family:Arial;
}

.top{
  padding:10px;
  display:flex;
  justify-content:space-between;
  background:#071028;
}

canvas{
  display:block;
  margin:auto;
}
button{
  background:#2563eb;
  color:white;
  border:none;
  padding:8px 15px;
  border-radius:6px;
}
</style>
  <script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js";
import { getFirestore } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore.js";
import { collection, getDocs, addDoc } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBDW_FQyDzWZLJORFtOwZQzF",
  authDomain: "rjvc-plan.firebaseapp.com",
  projectId: "rjvc-plan",
  storageBucket: "rjvc-plan.firebasestorage.app",
  messagingSenderId: "265431528728",
  appId: "1:265431528728:web:c3dc4b8e8f3ae4469a1a6d"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

  </script>
</head>

<body>

<div class="top">
<h3>Binary Tree Admin</h3>
<button onclick="logout()">Logout</button>
</div>
<div style="padding:10px;background:#071028;">
  <input id="newName" placeholder="Customer Name">
  <input id="parentId" placeholder="Parent ID">

  <select id="positionSelect">
    <option value="left">Left</option>
    <option value="right">Right</option>
  </select>

  <button onclick="addUser()">Add User</button>
</div>
  
<canvas id="tree" width="1200" height="700"></canvas>

<script>

const canvas=document.getElementById("tree");
const ctx=canvas.getContext("2d");

function node(x,y,text){
 ctx.beginPath();
 ctx.arc(x,y,25,0,Math.PI*2);
 ctx.fillStyle="#2563eb";
 ctx.fill();
 ctx.strokeStyle="#94a3b8";
 ctx.stroke();

 ctx.fillStyle="white";
 ctx.textAlign="center";
 ctx.textBaseline="middle";
 ctx.fillText(text,x,y);
}

function line(x1,y1,x2,y2){
 ctx.beginPath();
 ctx.moveTo(x1,y1);
 ctx.lineTo(x2,y2);
 ctx.strokeStyle="#94a3b8";
 ctx.stroke();
}

async function drawTree(){

  ctx.clearRect(0,0,canvas.width,canvas.height);

  const querySnapshot = await getDocs(collection(db,"users"));

  let users = [];

  querySnapshot.forEach((doc)=>{
    users.push(doc.data());
  });

  const root = users.find(u=>u.parent == null);

  if(!root){
    node(600,80,"No Root");
    return;
  }

  node(600,80,root.name);

  let children = users.filter(u=>u.parent == root.id);

  if(children[0]){
    line(600,100,350,230);
    node(350,250,children[0].name);
  }

  if(children[1]){
    line(600,100,850,230);
    node(850,250,children[1].name);
  }
}

drawTree();
async function addUser(){

  const name = document.getElementById("newName").value;
  const parentId = document.getElementById("parentId").value;
  const position = document.getElementById("positionSelect").value;

  if(!name){
  alert("Enter name");
  return;
}

let finalParent = parentId;

if(parentId == ""){
   finalParent = null;   // root user
}

  const newId = "u" + Date.now();

  await addDoc(collection(db,"users"),{
  id:newId,
  name:name,
  parent:finalParent,
  position:position
});

  alert("User Added");
  }
function logout(){
 location="index.html";
}

</script>

</body>
</html>
