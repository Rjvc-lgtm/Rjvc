<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>RJVC Login</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
body{
  background:#020617;
  color:white;
  font-family:Arial;
  text-align:center;
}
.box{
  max-width:300px;
  margin:100px auto;
  padding:20px;
  background:#071028;
  border-radius:10px;
}
input,select,button{
  width:100%;
  margin:8px 0;
  padding:10px;
  border-radius:6px;
  border:none;
}
button{
  background:#2563eb;
  color:white;
  font-weight:bold;
}
</style>
</head>

<body>

<div class="box">
<h2>RJVC Login</h2>

<input id="uid" placeholder="User ID">

<input id="pass" type="password" placeholder="Password">

<select id="type">
<option value="admin">Admin</option>
<option value="customer">Customer</option>
</select>

<button onclick="login()">Login</button>

<p id="msg"></p>
</div>

<script>
function login(){

  const id=document.getElementById("uid").value;
  const pass=document.getElementById("pass").value;
  const type=document.getElementById("type").value;

  if(type==="admin" && id==="admin" && pass==="1234"){
    location="admin.html";
  }
  else if(type==="customer"){
    location="customer.html";
  }
  else{
    document.getElementById("msg").innerText="Wrong Login";
  }
}
</script>

</body>
</html>
