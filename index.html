<!DOCTYPE html>
<html>
<head>
  <title>RJVC Admin Panel</title>
  <style>
    body {
      background-color: #0b1f33;
      color: white;
      text-align: center;
      font-family: Arial;
      margin-top: 100px;
    }
    input {
      padding: 10px;
      width: 200px;
    }
    button {
      padding: 10px 20px;
      background: #3498db;
      color: white;
      border: none;
      cursor: pointer;
    }
  </style>
</head>
<body>

<h1>RJVC Admin Panel</h1>

<input type="text" id="username" placeholder="User Name">
<button onclick="addUser()">Add User</button>

<p id="message"></p>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-app.js";
  import { getFirestore, collection, doc, setDoc } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyCsENsvEYmb72x8IkYrLRL07yhMf5GbLbk",
    authDomain: "rjvc-money.firebaseapp.com",
    projectId: "rjvc-money",
    storageBucket: "rjvc-money.firebasestorage.app",
    messagingSenderId: "773092277754",
    appId: "1:773092277754:web:5ac897ba8e666cceb53843"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  window.addUser = async function() {
    const name = document.getElementById("username").value;

    if(name === "") {
      alert("Enter username");
      return;
    }

    await setDoc(doc(collection(db, "users"), name), {
      id: name,
      name: name,
      parent: "root",
      position: "left"
    });

    document.getElementById("message").innerText = "User Added Successfully!";
    document.getElementById("username").value = "";
  }

</script>

</body>
</html>
