<!DOCTYPE html>
<html>
<head>
  <title>RJVC Admin Panel</title>
  <style>
    body {
      font-family: Arial;
      background: #0b1e33;
      text-align: center;
      padding-top: 100px;
      color: white;
    }
    input {
      padding: 10px;
      width: 200px;
    }
    button {
      padding: 10px 15px;
      background: #2196F3;
      color: white;
      border: none;
      cursor: pointer;
    }
  </style>
</head>
<body>

<h2>RJVC Admin Panel</h2>

<input type="text" id="username" placeholder="User Name">
<button onclick="addUser()">Add User</button>

<p id="msg"></p>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyCsEnsEvYmb72x8IkYrLRL07yhMf5GbLbk",
    authDomain: "rjvc-money.firebaseapp.com",
    projectId: "rjvc-money",
    storageBucket: "rjvc-money.appspot.com",
    messagingSenderId: "773092277754",
    appId: "1:773092277754:web:5ac897ba8ee666ceb53843"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  window.addUser = async function() {
    const name = document.getElementById("username").value;

    if (name === "") {
      document.getElementById("msg").innerText = "Enter name first";
      return;
    }

    try {
      await addDoc(collection(db, "users"), {
        name: name,
        created: new Date()
      });

      document.getElementById("msg").innerText = "User Added Successfully!";
      document.getElementById("username").value = "";

    } catch (error) {
      document.getElementById("msg").innerText = "Error: " + error;
    }
  }
</script>

</body>
  </html>
