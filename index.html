<!DOCTYPE html>
<html>
<head>
  <title>RJVC Admin Panel</title>
  <style>
    body {
      background-color: #0b1e2d;
      color: white;
      font-family: Arial;
      text-align: center;
      padding-top: 100px;
    }

    input {
      padding: 10px;
      width: 200px;
      font-size: 16px;
    }

    button {
      padding: 10px 20px;
      font-size: 16px;
      background-color: #2196f3;
      color: white;
      border: none;
      cursor: pointer;
    }

    button:hover {
      background-color: #0b7dda;
    }

    #message {
      margin-top: 20px;
      color: lightgreen;
    }
  </style>
</head>
<body>

  <h1>RJVC Admin Panel</h1>

  <input type="text" id="username" placeholder="User Name">
  <button onclick="addUser()">Add User</button>

  <div id="message"></div>

  <!-- Firebase Script -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-app.js";
    import { getFirestore, doc, setDoc } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCsENvsEYmb72x8IkYrLRL07yhMf5GbL0k",
      authDomain: "rjvc-money.firebaseapp.com",
      projectId: "rjvc-money",
      storageBucket: "rjvc-money.appspot.com",
      messagingSenderId: "773092277754",
      appId: "1:773092277754:web:5ac897ba8ee666cceb53843"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    window.addUser = async function () {
      const name = document.getElementById("username").value;

      if (name === "") {
        alert("Please enter user name");
        return;
      }

      try {
        await setDoc(doc(db, "users", name), {
          name: name,
          parent: "root",
          position: "left"
        });

        document.getElementById("message").innerText = "User Added Successfully!";
        document.getElementById("username").value = "";

      } catch (error) {
        console.error("Error adding user: ", error);
        alert("Error adding user");
      }
    };
  </script>

</body>
</html>
