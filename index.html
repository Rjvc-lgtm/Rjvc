<!DOCTYPE html>
<html>
<head>
  <title>RJVC Admin Panel</title>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js"></script>
  <style>
    body {
      background:#0b1c2d;
      color:white;
      font-family:Arial;
      text-align:center;
      padding-top:40px;
    }
    input, select, button {
      padding:10px;
      margin:5px;
      font-size:16px;
    }
    button {
      background:#2196F3;
      border:none;
      color:white;
      cursor:pointer;
    }
  </style>
</head>
<body>

<h1>RJVC Admin Panel</h1>

<input type="text" id="username" placeholder="User Name">
<input type="text" id="parentId" placeholder="Parent ID (root)">
<select id="position">
  <option value="left">Left</option>
  <option value="right">Right</option>
</select>
<button onclick="addUser()">Add User</button>

<p id="message"></p>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getFirestore, collection, doc, setDoc, getDoc } 
from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "YOUR_API_KEY",
  authDomain: "rjvc-momoney.firebaseapp.com",
  projectId: "rjvc-momoney",
  storageBucket: "rjvc-momoney.appspot.com",
  messagingSenderId: "YOUR_SENDER_ID",
  appId: "YOUR_APP_ID"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

// Root create if not exists
const rootRef = doc(db, "users", "root");
const rootSnap = await getDoc(rootRef);

if (!rootSnap.exists()) {
  await setDoc(rootRef, {
    id: "root",
    name: "root",
    parent: null,
    position: "root"
  });
}

window.addUser = async function () {

  const username = document.getElementById("username").value;
  const parentId = document.getElementById("parentId").value || "root";
  const position = document.getElementById("position").value;

  if (!username) {
    document.getElementById("message").innerText = "Enter User Name";
    return;
  }

  const userRef = doc(db, "users", username);

  await setDoc(userRef, {
    id: username,
    name: username,
    parent: parentId,
    position: position
  });

  document.getElementById("message").innerText = "User Added Successfully!";
}

</script>

</body>
</html>
